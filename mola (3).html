<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mola Sırası</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mola">
<meta name="application-name" content="Mola Sırası">
<link rel="manifest" id="manifest">
<link rel="icon" id="favicon">
<link rel="apple-touch-icon" id="appleIcon">
<script>
/* ===== Yerleşik manifest (tek dosya) =====
   İkonlar canvas ile çizilir, manifest sayfanın içinde data: adresi olarak tanımlanır. */
(function(){
  try {
    function icon(size, full){
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d'), u = size / 100;
      // zemin
      x.save();
      if (!full){ const r = 23 * u; x.beginPath(); x.moveTo(r, 0); x.arcTo(size, 0, size, size, r); x.arcTo(size, size, 0, size, r); x.arcTo(0, size, 0, 0, r); x.arcTo(0, 0, size, 0, r); x.closePath(); x.clip(); }
      const bg = x.createLinearGradient(0, 0, 0, size);
      bg.addColorStop(0, '#22252d'); bg.addColorStop(1, '#0c0d11');
      x.fillStyle = bg; x.fillRect(0, 0, size, size);
      const glow = x.createRadialGradient(50*u, 18*u, 0, 50*u, 18*u, 60*u);
      glow.addColorStop(0, 'rgba(251,146,60,.28)'); glow.addColorStop(1, 'rgba(251,146,60,0)');
      x.fillStyle = glow; x.fillRect(0, 0, size, size);
      // maskable'da içerik güvenli alana sığsın
      const k = full ? .8 : 1;
      x.translate(size/2, size/2); x.scale(k, k); x.translate(-size/2, -size/2);
      // halka izi
      x.lineCap = 'round';
      x.strokeStyle = 'rgba(255,255,255,.09)'; x.lineWidth = 7.5 * u;
      x.beginPath(); x.arc(50*u, 50*u, 30*u, 0, Math.PI*2); x.stroke();
      // turuncu ilerleme (¾ dolu)
      const rg = x.createLinearGradient(20*u, 20*u, 80*u, 80*u);
      rg.addColorStop(0, '#fdba74'); rg.addColorStop(1, '#f97316');
      x.strokeStyle = rg; x.shadowColor = 'rgba(249,115,22,.65)'; x.shadowBlur = 6 * u;
      x.beginPath(); x.arc(50*u, 50*u, 30*u, -Math.PI/2, Math.PI); x.stroke();
      x.shadowBlur = 0;
      // fincan (ortalanmış ve küçük boyutta seçilsin diye biraz büyük)
      x.translate(50*u, 50*u); x.scale(1.15, 1.15); x.translate(-50.5*u, -47.75*u);
      x.fillStyle = '#f3f4f6'; x.strokeStyle = '#f3f4f6';
      x.beginPath();
      x.moveTo(38*u, 46*u); x.lineTo(58*u, 46*u); x.lineTo(58*u, 52*u);
      x.quadraticCurveTo(58*u, 61*u, 48*u, 61*u); x.quadraticCurveTo(38*u, 61*u, 38*u, 52*u);
      x.closePath(); x.fill();
      x.lineWidth = 2.6 * u;
      x.beginPath(); x.arc(59.5*u, 51*u, 3.6*u, -Math.PI/2, Math.PI/2); x.stroke();      // kulp
      // buhar
      x.lineWidth = 2.2 * u; x.globalAlpha = .75;
      [[44, 0], [51, 1]].forEach(([sx]) => {
        x.beginPath(); x.moveTo(sx*u, 42*u);
        x.bezierCurveTo((sx-2.2)*u, 39.5*u, (sx+2.2)*u, 37.5*u, sx*u, 34.5*u); x.stroke();
      });
      x.restore();
      return c.toDataURL('image/png');
    }
    const base  = location.href.split('#')[0].split('?')[0];
    const scope = base.replace(/[^/]*$/, '');
    const manifest = {
      id: base,
      name: 'Mola Sırası',
      short_name: 'Mola',
      description: 'Şirket mola sırası — yemek ve kısa mola',
      lang: 'tr',
      dir: 'ltr',
      start_url: base,
      scope: scope,
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#0c0d11',
      theme_color: '#0c0d11',
      icons: [
        { src: icon(192),       sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: icon(512),       sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: icon(512, true), sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    document.getElementById('manifest').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.getElementById('favicon').href = icon(64);
    document.getElementById('appleIcon').href = icon(180, true);   // iOS köşeleri kendisi yuvarlar
  } catch(e){ /* kısıtlı ortamlarda sessizce geç */ }
})();
</script>
<style>
@property --c{syntax:'<color>';inherits:true;initial-value:#fb923c}
@property --c2{syntax:'<color>';inherits:true;initial-value:#f97316}
@property --rc{syntax:'<color>';inherits:true;initial-value:#fb923c}
:root{
  --bg:#0c0d11; --s1:#15171d; --s2:#1d2028; --s3:#262a33; --line:rgba(255,255,255,.06);
  --tx:#f3f4f6; --mut:#9097a3; --dim:#5d6470;
  --ok:#34d399; --bad:#f87171;
  --c:#fb923c; --c2:#f97316; --glow:rgba(251,146,60,.22);
}
body.m-kisa{--c:#60a5fa;--c2:#3b82f6;--glow:rgba(96,165,250,.22)}
body.turn{--glow:rgba(52,211,153,.22)}
body.over{--c:#f87171;--c2:#ef4444;--glow:rgba(248,113,113,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{transition:--c .8s ease,--c2 .8s ease}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
/* arka plan ışığı: her renk ayrı katman, opaklıkla yumuşak geçiş */
#bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bg i{position:absolute;left:50%;top:-200px;width:680px;height:560px;transform:translateX(-50%);opacity:0;transition:opacity 1.4s ease}
#bg .g-yemek{background:radial-gradient(closest-side,rgba(251,146,60,.20),transparent)}
#bg .g-kisa{background:radial-gradient(closest-side,rgba(96,165,250,.20),transparent)}
#bg .g-turn{background:radial-gradient(closest-side,rgba(52,211,153,.20),transparent)}
#bg .g-over{background:radial-gradient(closest-side,rgba(248,113,113,.20),transparent)}
body.m-yemek:not(.turn):not(.over) #bg .g-yemek,body.m-kisa:not(.turn):not(.over) #bg .g-kisa,body.turn #bg .g-turn,body.over #bg .g-over{opacity:1}
button,input{font-family:inherit;color:inherit}
#app{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 14px)}
.hidden{display:none!important}
.screen{flex:1;display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}

/* ---------- giriş ---------- */
#login{justify-content:center}
.logo{width:60px;height:60px;border-radius:20px;background:linear-gradient(140deg,#fdba74,#f97316);display:grid;place-items:center;margin-bottom:26px;box-shadow:0 14px 36px -10px rgba(249,115,22,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.logo svg{width:30px;height:30px;color:#2a1405}
#login h1{font-size:32px;font-weight:750;letter-spacing:-.025em;margin-bottom:8px}
#login p{color:var(--mut);font-size:16px;margin-bottom:30px;line-height:1.5}
.field{position:relative;margin-bottom:12px}
input{width:100%;font-size:17px;padding:18px 18px;border-radius:18px;border:1px solid var(--line);background:var(--s1);outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--dim)}
input:focus{border-color:var(--c);box-shadow:0 0 0 4px var(--glow)}
input.err{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- butonlar ---------- */
.btn{position:relative;overflow:hidden;width:100%;height:58px;border:0;border-radius:18px;font-size:17px;font-weight:650;cursor:pointer;background:linear-gradient(180deg,var(--c),var(--c2));color:#16110b;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s,opacity .2s,filter .2s}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.ghost{background:var(--s2);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.btn.ok{background:linear-gradient(180deg,#4ade80,#22c55e);color:#05240f;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.link{background:none;border:0;color:var(--mut);font-size:15px;padding:12px;cursor:pointer;transition:color .2s}
.link:active{color:var(--tx)}

/* ---------- üst ---------- */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hello{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--s2);color:var(--tx);flex:none;border:1px solid var(--line)}
.hello small{display:block;font-size:12px;color:var(--dim)}
.hello b{font-size:15px;font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.iconbtn svg{width:18px;height:18px}

/* ---------- sekmeler ---------- */
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:5px}
.tabs .ind{will-change:transform;position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:15px;background:var(--s3);box-shadow:0 4px 14px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .45s cubic-bezier(.22,1,.36,1)}
.tabs[data-i="1"] .ind{transform:translateX(100%)}
.tab{position:relative;z-index:1;border:0;background:none;padding:10px 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.tab svg{width:20px;height:20px;color:var(--dim);transition:color .3s}
.tab .tt{text-align:left;line-height:1.2}
.tab .tn{display:block;font-size:15px;font-weight:600;color:var(--mut);transition:color .3s}
.tab .td{display:block;font-size:12px;color:var(--dim)}
.tab.on .tn{color:var(--tx)}
.tab.on .td{color:var(--mut)}
.tab.on.t-yemek svg{color:#fb923c}
.tab.on.t-kisa svg{color:#60a5fa}
.tab .badge{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--s1),0 0 10px var(--ok)}

/* ---------- merkez ---------- */
#card{justify-content:space-between}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0}
.enter .hero > *,.enter .acts{animation:up .7s cubic-bezier(.22,1,.36,1) both}
.enter .hero > :nth-child(2){animation-delay:.05s}
.enter .hero > :nth-child(3){animation-delay:.09s}
.enter .hero > :nth-child(4){animation-delay:.13s}
.enter .acts{animation-delay:.16s}
@keyframes up{from{opacity:0;transform:translateY(6px)}}

.dial{--ds:min(236px,32vh);position:relative;width:var(--ds);height:var(--ds);margin-bottom:calc(var(--ds) * .1);--rc:var(--c);transition:--rc .8s ease}
.dial.turn{--rc:var(--ok)}
.dial.over{--rc:var(--bad)}
.dial > svg{position:absolute;inset:0}
.dial svg circle{fill:none}
.dial .hair{stroke:var(--line);stroke-width:1}
.dial .ticks line{stroke:var(--s3);stroke-width:1.6;stroke-linecap:round;transition:stroke .4s}
.dial .ticks line.mj{stroke-width:2.4}
.dial .ticks line.on{stroke:var(--rc);opacity:.6}
.dial .trk{stroke:var(--s2);stroke-width:8;stroke-linecap:round}
.dial .prg{stroke-width:8;stroke-linecap:round}
.dial .prg.zero{opacity:0}
.dial.multi .prg.ov{stroke:var(--bad);filter:drop-shadow(0 0 5px rgba(248,113,113,.6))}
.dial .prg{stroke:var(--rc);transition:stroke-dasharray 1s linear,stroke .6s,opacity .4s;filter:drop-shadow(0 0 6px var(--rc))}
.dial .in{position:absolute;inset:15.3%;border-radius:50%;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.045),transparent 70%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .bigN{font-size:calc(var(--ds) * .33);font-weight:750;letter-spacing:-.05em;line-height:.9}
.dial .time{display:flex;align-items:center;font-family:ui-rounded,"SF Pro Rounded","Google Sans","Product Sans",-apple-system,"Segoe UI",Roboto,sans-serif;font-size:calc(var(--ds) * .22);font-weight:600;letter-spacing:-.035em;line-height:1;color:var(--tx);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"zero" 0}
.dial .time .col{display:inline-flex;flex-direction:column;gap:9px;margin:0 6px;position:relative;top:1px}
.dial .time .col i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
.dial .time .sg{font-size:.6em;font-weight:500;margin-right:.06em;opacity:.8}
/* mola kadranı: sade, ince halka, çentiksiz */
.dial.brk .trk,.dial.brk .prg{stroke-width:6}
.dial.brk .in{inset:12.7%;background:radial-gradient(circle at 50% 28%,var(--s2),var(--s1) 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -6px 14px rgba(0,0,0,.35),0 18px 36px -16px rgba(0,0,0,.85)}
.dial.brk .hair{opacity:0}
.dial.brk .cap{letter-spacing:.02em;font-weight:500;font-size:13px;margin-top:10px;text-transform:none}
.dial.brk .cap b{color:var(--tx);font-weight:600}
.dial.over .prg{filter:none;opacity:.85}
.dial.over .in{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.65}}
.dial.over .time{color:var(--bad)}
.dial .cap{font-size:11px;color:var(--mut);margin-top:8px;letter-spacing:.14em;font-weight:600}
.dial .ic{width:calc(var(--ds) * .24);height:calc(var(--ds) * .24);color:var(--rc)}
.dial.turn::after{content:'';position:absolute;inset:7.6%;border-radius:50%;border:2px solid var(--ok);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.18);opacity:0}}

h2{font-size:25px;font-weight:750;letter-spacing:-.02em;margin-bottom:8px}
.sub{color:var(--mut);font-size:16px;line-height:1.5;max-width:300px}
.sub b{color:var(--tx);font-weight:600}
.faces{display:flex;justify-content:center;margin-top:16px}
.faces .av{width:34px;height:34px;font-size:12px;margin-left:-8px;border:2px solid var(--bg)}
.faces .av:first-child{margin-left:0}
.faces .av.me{background:var(--c);color:#16110b}
.acts{display:flex;flex-direction:column}
.a-pri{min-height:58px}
.a-sec{height:48px;display:flex;align-items:center;justify-content:center}
.sub2{font-size:14px;color:var(--mut);margin-top:10px}

/* ---------- alt + liste ---------- */
.foot{display:flex;justify-content:center;margin-top:6px}
.foot .link{display:flex;align-items:center;gap:6px;font-size:14px;padding:8px 12px}
.foot svg{width:16px;height:16px;transition:transform .3s}
.foot .open svg{transform:rotate(180deg)}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:4px 16px 6px;margin-top:6px;animation:up .3s both}
.grp{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);letter-spacing:.12em;font-weight:600;text-transform:uppercase;padding:14px 0 6px}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:15px;border-top:1px solid var(--line)}
.grp + .li{border-top:0}
.li .av{width:32px;height:32px;font-size:12px}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.me .av{background:var(--c);color:#16110b;border-color:transparent}
.li .tag{font-size:11px;color:var(--c);background:var(--glow);padding:2px 7px;border-radius:6px;margin-left:6px;font-weight:600}
.li .tm{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.li .n{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;width:16px;text-align:right}
.red{color:var(--bad)!important}
.li .x{background:rgba(248,113,113,.12);border:0;color:var(--bad);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.empty{color:var(--dim);padding:6px 0 12px;font-size:14px}

/* ===== küçük animasyonlar ===== */
/* dokunma dalgası */
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);pointer-events:none;animation:rip .55s ease-out forwards}
.btn.ghost .rip{background:rgba(255,255,255,.12)}
@keyframes rip{to{transform:scale(1);opacity:0}}
/* bildirim balonu */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-16px) scale(.96);opacity:0;background:var(--s3);color:var(--tx);border:1px solid var(--line);font-size:14px;font-weight:500;padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);transition:all .35s cubic-bezier(.3,1.4,.5,1);pointer-events:none;z-index:40;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
#toast span{margin-right:6px}
#net{display:none;text-align:center;font-size:13px;color:#fca5a5;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.22);padding:8px 12px;border-radius:12px;margin-bottom:10px}
#net.on{display:block;animation:up .3s both}
.loading .dial{opacity:.5;animation:breathe 1.6s ease-in-out infinite}
/* giriş logosu: akrep yavaşça döner */
.logo .hand{transform-origin:12px 13px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
/* kadran ikonları */
.dial .ic.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(-3deg)}}
.steam{animation:steam 2.4s ease-in-out infinite;opacity:.9}
.steam:nth-of-type(2){animation-delay:.6s}
@keyframes steam{0%{transform:translateY(1.5px);opacity:0}40%{opacity:1}100%{transform:translateY(-2.5px);opacity:0}}
.draw{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .5s .25s cubic-bezier(.6,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* sayaçtaki iki nokta hafifçe nefes alır */
/* sıra numarası yukarı kayar */
.roll{animation:roll .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes roll{from{transform:translateY(26px);opacity:0}}
.upfx{position:absolute;top:22%;right:18%;font-size:13px;font-weight:700;color:var(--ok);animation:upfx 1.4s ease-out forwards}
@keyframes upfx{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
/* sekme ikonu zıplar */
.tab svg.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{40%{transform:scale(1.25) rotate(-8deg)}}
.badge{animation:badge .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes badge{from{transform:scale(0)}}
/* yüzler sırayla belirir, sizinki hafifçe sallanır */
.faces .av{animation:face .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes face{from{transform:scale(.4);opacity:0}}
.faces .av.me{animation:face .4s cubic-bezier(.3,1.6,.5,1) both,nudge 2.6s 1s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:translateX(0)}86%{transform:translateX(-3px)}93%{transform:translateX(2px)}}
/* liste satırları açılırken sırayla gelir */
.sheet.fresh .li,.sheet.fresh .grp{animation:up .35s both}
/* kalem ikonu */
.iconbtn:active svg{transform:rotate(-15deg);transition:transform .15s}
/* giriş butonu ok ucu */
#loginBtn{display:flex;align-items:center;justify-content:center;gap:8px}
#loginBtn svg{width:18px;height:18px;transition:transform .25s}
#loginBtn:hover svg,#loginBtn:active svg{transform:translateX(4px)}

/* kısa ekranlar (ör. 360x640): her şey kaydırmadan sığsın */
@media (max-height:700px){
  .dial{--ds:min(236px,27vh)}
  .hero{padding:10px 0}
  h2{font-size:22px;margin-bottom:6px}
  .faces{margin-top:10px}
  .sub2{margin-top:6px}
  .a-sec{height:42px}
  .top{margin-bottom:12px}
}
/* ===== yönetici ===== */
.adm-link{display:block;margin:6px auto 4px;font-size:13px;color:var(--dim)}
.ahead{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;margin-bottom:16px}
.ahead b{font-size:17px;font-weight:650;text-align:center}
.ahead .link{padding:8px 0;font-size:14px;justify-self:end}
.ahead .link.off{visibility:hidden}
.pin{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:12vh}
.pin .lock{width:56px;height:56px;border-radius:18px;background:var(--s2);display:grid;place-items:center;margin-bottom:18px;color:var(--mut)}
.pin .lock svg{width:26px;height:26px}
.pin h2{margin-bottom:6px}
.pin .sub{margin-bottom:22px}
.pin input{text-align:center;letter-spacing:.2em}
.acard{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.acard .ah{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.acard .ah svg{width:20px;height:20px}
.acard .ah b{font-size:16px;font-weight:650;flex:1}
.acard .ah small{font-size:13px;color:var(--mut)}
.a-yemek .ah svg{color:#fb923c}
.a-kisa .ah svg{color:#60a5fa}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.setrow span{font-size:15px;color:var(--mut)}
.step{display:flex;align-items:center;gap:4px;background:var(--s2);border-radius:14px;padding:4px}
.step button{width:38px;height:38px;border:0;border-radius:10px;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--tx)}
.step button:active{background:var(--s3)}
.step button:disabled{opacity:.3}
.step b{min-width:64px;text-align:center;font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.acard .li .acts2{display:flex;gap:6px}
.mini{border:0;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;background:var(--s2);color:var(--tx)}
.mini.red{background:rgba(248,113,113,.12);color:var(--bad)}
.btn.danger{background:rgba(248,113,113,.12);color:var(--bad);box-shadow:none;margin:6px 0 10px}
.anote{font-size:13px;color:var(--dim);text-align:center;line-height:1.5;padding:0 10px 10px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ================= AYARLAR ================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDskdRcxsoGb5_n1Ifjo_MwOHZjDqMMYCg",
  authDomain: "s321-32be4.firebaseapp.com",
  databaseURL: "https://s321-32be4.firebaseio.com",
  projectId: "s321-32be4",
  storageBucket: "s321-32be4.firebasestorage.app",
  messagingSenderId: "1014204689679",
  appId: "1:1014204689679:web:4a192710b08304a28ca27a"
};
const ODA = "sirket";   // veritabanı yolu: mola/sirket
const TURLER = {
  yemek: { ad: "Yemek molası", kisa: "Yemek", dk: 25, ayniAnda: 2 },
  kisa:  { ad: "Kısa mola",    kisa: "Kısa",  dk: 10, ayniAnda: 3 }
};
const ZORLA_KAT = 2;    // süreyi bu kadar katı aşan kişiyi herkes "bitir"ebilir
const YONETICI_SIFRE = "SmhArn02";   // yönetici ekranı şifresi — DEĞİŞTİR
// Not: TURLER'deki süre ve "aynı anda" sayıları sadece başlangıç değeri;
// yönetici ekranından değiştirilince Firebase'deki ayar geçerli olur.
/* =========================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEYS = Object.keys(TURLER);
const ini = n => esc(String(n).split(' ').filter(Boolean).slice(0,2).map(w => w[0].toLocaleUpperCase('tr')).join(''));
const SVG = (p, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  yemek: '<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4-3.5 7.5V13H17"/>',
  kisa:  '<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path class="steam" d="M8 3.5c0 1 1 1.5 1 2.5"/><path class="steam" d="M12 3.5c0 1 1 1.5 1 2.5"/>',
  check: '<path class="draw" d="M5 12.5l4.5 4.5L19 7.5"/>',
  down:  '<path d="M6 9l6 6 6-6"/>'
};

/* güvenli kayıt: localStorage engelliyse (önizleme, gizli sekme) hafızada tutar */
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ mem[k] = v; try { localStorage.setItem(k, v); } catch(e){} }
};

let me = null;
try { me = JSON.parse(store.get('mola_me')); } catch(e){}
let state = norm(null);
let tab = store.get('mola_tab');
if (!TURLER[tab]) tab = KEYS[0];
const lastIdx = {};
let lastHtml = '';
let busy = false, listOpen = false, wasTurn = false, lastKey = '', tx, audio;
let offset = 0, ready = false, online = true;

const now = () => Date.now() + offset;   // sunucu saatine göre (telefon saati yanlış olsa da sayaçlar doğru)
function norm(s){
  s = s || {};
  const o = {};
  KEYS.forEach(k => o[k] = { q: (s[k] && s[k].q) || {}, a: (s[k] && s[k].a) || {} });
  o.ayar = (s.ayar && typeof s.ayar === 'object') ? s.ayar : {};   // yönetici ayarları (silinmesin)
  return o;
}
// bir mola türünün geçerli ayarı: Firebase'deki yönetici ayarı, yoksa TURLER
function cfg(k, s = state){
  const a = (s.ayar && s.ayar[k]) || {};
  return { ...TURLER[k], dk: +a.dk || TURLER[k].dk, ayniAnda: +a.ayniAnda || TURLER[k].ayniAnda };
}
const sorted = q => Object.entries(q).map(([id,v]) => ({id, ...v})).sort((x,y) => x.o - y.o);
// mola sayacı: m:ss, iki nokta ve + işareti ayrı stillenir
const fmtH = (ms, over) => { const s = Math.max(0, Math.floor(Math.abs(ms)/1000)); return (over ? '<span class="sg">+</span>' : '') + Math.floor(s/60) + '<span class="col"><i></i><i></i></span>' + String(s%60).padStart(2,'0'); };
const fmt = ms => { const s = Math.max(0, Math.floor(Math.abs(ms)/1000)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };

/* ---------- veri katmanı ----------
   Firebase varsa: herkes aynı sırayı canlı görür (mola/sirket).
   Firebase yüklenemezse: yerel kayıtla çalışır, üstte uyarı çıkar. */
function initStore(){
  if (FIREBASE_CONFIG.apiKey && window.firebase){
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      const db = firebase.database();
      const ref = db.ref('mola/' + ODA);
      ref.on('value',
        s => {
          state = norm(s.val());
          if (!ready && me){ const w = where(); if (w) tab = w.k; }   // ilk yüklemede bulunduğunuz sekmeye geç
          ready = true; render();
        },
        () => { ready = true; setNet('Veritabanına erişim reddedildi'); render(); });
      db.ref('.info/connected').on('value', s => { online = !!s.val(); setNet(online ? '' : 'Bağlantı yok, yeniden bağlanıyor…', 2500); });
      db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
      // tüm işlemler tek transaction: iki kişi aynı anda bassa da sıra karışmaz
      tx = fn => ref.transaction(cur => fn(norm(cur))).then(r => r.committed);
      return;
    } catch(e){ /* aşağıda yerele düşer */ }
  }
  localStore();
  if (FIREBASE_CONFIG.apiKey) setNet('Sunucuya ulaşılamadı · sadece bu cihaz');
}
function localStore(){
  const K = 'mola_data_' + ODA;
  const read = () => { try { return JSON.parse(store.get(K)); } catch(e){ return null; } };
  state = norm(read()); ready = true;
  addEventListener('storage', e => { if (e.key === K){ state = norm(read()); render(); } });
  tx = fn => {
    const r = fn(norm(read()));
    if (r !== undefined){ store.set(K, JSON.stringify(r)); state = norm(r); render(); }
    return Promise.resolve(r !== undefined);
  };
}
let netT;
function setNet(msg, delay = 0){
  clearTimeout(netT);
  const el = $('#net');
  if (!msg){ el.classList.remove('on'); return; }
  netT = setTimeout(() => { el.textContent = msg; el.classList.add('on'); }, delay);
}

/* ---------- durum ---------- */
function where(s = state){
  for (const k of KEYS){
    if (s[k].a[me.id]) return { k, yer:'a' };
    if (s[k].q[me.id]) return { k, yer:'q' };
  }
  return null;
}
function info(k, s = state){
  const list = sorted(s[k].q);
  const active = Object.keys(s[k].a).length;
  const free = Math.max(0, cfg(k, s).ayniAnda - active);
  const idx = list.findIndex(x => x.id === me.id);
  return { list, active, free, idx, myTurn: idx >= 0 && idx < free, onBreak: !!s[k].a[me.id] };
}
// sıradaki pozisyon için tahmini bekleme (dk)
function eta(k, pos){
  const T = cfg(k), dur = T.dk * 60000;
  const slots = Object.values(state[k].a).map(a => Math.max(0, a.t + dur - now()));
  while (slots.length < T.ayniAnda) slots.push(0);
  for (let i = 0; i < pos; i++){ slots.sort((a,b) => a-b); slots[0] += dur; }
  return Math.ceil(Math.min(...slots) / 60000);
}

/* ---------- işlemler ---------- */
const actions = {
  join: (s, k) => {
    if (where(s)) return;
    const last = Math.max(0, ...Object.values(s[k].q).map(v => v.o));
    s[k].q[me.id] = { n: me.name, o: Math.max(now(), last + 1) };
    return s;
  },
  leave: (s, k) => { if (!s[k].q[me.id]) return; delete s[k].q[me.id]; return s; },
  go: (s, k) => {
    if (!info(k, s).myTurn) return;
    delete s[k].q[me.id];
    s[k].a[me.id] = { n: me.name, t: now() };
    return s;
  },
  skip: (s, k) => {   // arkadaki kişiyle yer değiştirir
    const i = info(k, s);
    if (i.idx < 0 || !(i.myTurn || i.idx === 0)) return;
    const nx = i.list[i.idx + 1];
    if (!nx) return;
    const o = s[k].q[me.id].o;
    s[k].q[me.id].o = s[k].q[nx.id].o;
    s[k].q[nx.id].o = o;
    return s;
  },
  back: (s, k) => { if (!s[k].a[me.id]) return; delete s[k].a[me.id]; return s; },
  kick: (s, k, id) => {
    const a = s[k].a[id];
    if (!a || now() - a.t < cfg(k, s).dk * ZORLA_KAT * 60000) return;
    delete s[k].a[id]; return s;
  },

  /* --- yönetici --- */
  cfg: (s, _, { k, f, d }) => {       // aynı anda / süre ayarı
    const c = cfg(k, s);
    const v = f === 'dk' ? Math.min(120, Math.max(5, c.dk + d)) : Math.min(20, Math.max(1, c.ayniAnda + d));
    if (v === c[f]) return;
    s.ayar[k] = { dk: c.dk, ayniAnda: c.ayniAnda, [f]: v };
    return s;
  },
  aKick:   (s, _, { k, id }) => { if (!s[k].a[id]) return; delete s[k].a[id]; return s; },
  aRemove: (s, _, { k, id }) => { if (!s[k].q[id]) return; delete s[k].q[id]; return s; },
  aUp:     (s, _, { k, id }) => {   // bir üst sıraya al
    const l = sorted(s[k].q), j = l.findIndex(x => x.id === id);
    if (j < 1) return;
    const p = l[j - 1], o = s[k].q[id].o;
    s[k].q[id].o = s[k].q[p.id].o; s[k].q[p.id].o = o;
    return s;
  },
  reset: s => {
    let ch = false;
    KEYS.forEach(k => { if (Object.keys(s[k].q).length || Object.keys(s[k].a).length) ch = true; s[k] = { q: {}, a: {} }; });
    return ch ? s : undefined;
  }
};

const FX = {
  join:  ['Sıraya girdiniz', '👋'],
  leave: ['Sıradan çıktınız', ''],
  go:    ['İyi molalar', '☕'],
  skip:  ['Yer değiştirdiniz', '↕'],
  back:  ['Tekrar hoş geldiniz', '✨'],
  kick:  ['Mola bitirildi', ''],
  aKick: ['Mola bitirildi', ''],
  aRemove: ['Sıradan çıkarıldı', ''],
  reset: ['Sıra sıfırlandı', '']
};
async function run(name, arg){
  if (busy) return;
  busy = true;
  const k = tab;
  let ok = false;
  try { ok = await tx(s => actions[name](s, k, arg)); }
  catch(e){ toast('Bağlantı hatası, tekrar deneyin', '⚠️'); }
  busy = false; render();
  if (ok && FX[name]){
    const [msg, emo] = FX[name];
    toast(msg, emo);
    if (navigator.vibrate) navigator.vibrate(12);
  }
}

/* ---------- minik efektler ---------- */
let toastT;
function toast(msg, emo){
  const t = $('#toast');
  t.innerHTML = (emo ? `<span>${emo}</span>` : '') + esc(msg);
  t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800);
}
function stagger(root){
  root.querySelectorAll('.grp,.li').forEach((el, j) => el.style.animationDelay = (j * .035) + 's');
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn');
  if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), sz = Math.max(r.width, r.height) * 2;
  const s = document.createElement('span');
  s.className = 'rip';
  s.style.cssText = `width:${sz}px;height:${sz}px;left:${e.clientX - r.left - sz/2}px;top:${e.clientY - r.top - sz/2}px`;
  b.appendChild(s);
  setTimeout(() => s.remove(), 600);
});

/* ---------- bildirim ---------- */
function ding(){
  try {
    navigator.vibrate && navigator.vibrate([200,100,200,100,400]);
    if (!audio) return;
    [0, .18, .36].forEach((d,i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = [880,1100,1320][i];
      g.gain.setValueAtTime(.22, audio.currentTime + d);
      g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + d + .16);
      o.connect(g).connect(audio.destination);
      o.start(audio.currentTime + d); o.stop(audio.currentTime + d + .17);
    });
  } catch(e){}
}

/* ---------- kadran ---------- */
const R = 100, CIRC = 2 * Math.PI * R, TICKS = 60;
function ticks(f){
  let h = '';
  for (let i = 0; i < TICKS; i++){
    const a = i / TICKS * 2 * Math.PI - Math.PI/2, r1 = 111, r2 = i % 5 ? 114.5 : 117;
    h += `<line class="${i % 5 ? '' : 'mj '}${i / TICKS < f ? 'on' : ''}" x1="${(118 + r1*Math.cos(a)).toFixed(1)}" y1="${(118 + r1*Math.sin(a)).toFixed(1)}" x2="${(118 + r2*Math.cos(a)).toFixed(1)}" y2="${(118 + r2*Math.sin(a)).toFixed(1)}"/>`;
  }
  return `<g class="ticks">${h}</g>`;
}
/* Kadran: halka "dilimlerden" oluşur.
   Molada: tek dilim, kendi süreniz + uçta parlayan nokta.
   Boşta / sırada: her dilim bir mola yeri; dolu olanlar o kişinin süresiyle dolar. */
function slots(k){
  const dur = cfg(k).dk * 60000;
  const segs = Object.values(state[k].a).sort((x,y) => x.t - y.t).map(a => ({ t: a.t, dur }));
  while (segs.length < cfg(k).ayniAnda) segs.push({ f: 0 });
  return segs;
}
function segFrac(sg){ return sg.t ? (now() - sg.t) / sg.dur : (sg.f || 0); }
function dial(cls, inner, segs){
  const n = segs.length, gap = n > 1 ? 18 : 0, L = CIRC / n - gap;
  let trk = '', prg = '';
  segs.forEach((sg, i) => {
    const off = (-(i * CIRC / n + gap / 2)).toFixed(1);
    const f = segFrac(sg), fc = Math.min(1, Math.max(0, f));
    const data = sg.t ? `data-ring="${sg.t}" data-dur="${sg.dur}" data-len="${L.toFixed(1)}"` : '';
    trk += `<circle class="trk" cx="118" cy="118" r="${R}" stroke-dasharray="${L.toFixed(1)} ${CIRC.toFixed(1)}" stroke-dashoffset="${off}"/>`;
    prg += `<circle class="prg ${f > 1 ? 'ov' : ''} ${fc < .003 ? 'zero' : ''}" cx="118" cy="118" r="${R}" stroke-dasharray="${(L * fc).toFixed(1)} ${CIRC.toFixed(1)}" stroke-dashoffset="${off}" ${data}/>`;
  });
  return `<div class="dial ${cls} ${n > 1 ? 'multi' : ''}">
    <svg viewBox="0 0 236 236">
      ${/brk/.test(cls) ? ticks(Math.min(1, segFrac(segs[0]))) : ''}
      <circle class="hair" cx="118" cy="118" r="${R - 16}"/>
      <g transform="rotate(-90 118 118)" fill="none">${trk}${prg}</g>
    </svg>
    <div class="in">${inner}</div></div>`;
}

/* ---------- çizim ---------- */
function buildTabs(){
  $('#tabs').innerHTML = '<div class="ind"></div>' + KEYS.map(k => `
    <button class="tab t-${k}" data-tab="${k}">
      ${SVG(ICON[k])}
      <span class="tt"><span class="tn">${esc(TURLER[k].kisa)}</span><span class="td" data-td="${k}">${cfg(k).dk} dakika</span></span>
    </button>`).join('');
}

function render(){
  if (!me) return;
  if (!ready){
    if (!$('#card .loading')) $('#card').innerHTML = `<div class="hero loading">${dial('', '', [{ f: 0 }])}<div class="sub">Sıra yükleniyor…</div></div>`;
    renderAdmin();
    return;
  }
  const T = cfg(tab), i = info(tab), w = where();
  const dis = busy ? 'disabled' : '';

  document.querySelectorAll('[data-td]').forEach(el => el.textContent = cfg(el.dataset.td).dk + ' dakika');
  // sekmeler (yeniden çizmeden: kaydırma animasyonu bozulmasın)
  $('#tabs').dataset.i = KEYS.indexOf(tab);
  document.querySelectorAll('.tab').forEach(b => {
    const k = b.dataset.tab;
    b.classList.toggle('on', k === tab);
    const has = b.querySelector('.badge');
    if (w && w.k === k && !has) b.insertAdjacentHTML('afterbegin', '<span class="badge"></span>');
    if (!(w && w.k === k) && has) has.remove();
  });

  const anyTurn = KEYS.some(k => info(k).myTurn);
  if (anyTurn && !wasTurn) ding();
  wasTurn = anyTurn;
  document.title = anyTurn ? '● Sıra sizde' : 'Mola Sırası';

  // alt kısım her ekranda aynı iskelet: ana buton satırı + ikincil bağlantı satırı
  const acts = (pri, sec = '') => `<div class="acts"><div class="a-pri">${pri}</div><div class="a-sec">${sec}</div></div>`;
  const link = (a, txt) => `<button class="link" data-a="${a}" ${dis}>${txt}</button>`;

  let html, mood = '', key;
  if (i.onBreak){
    const t = state[tab].a[me.id].t, el = now() - t, dur = T.dk * 60000, over = el > dur;
    mood = over ? 'over' : ''; key = 'b' + over;
    html = `<div class="hero">
        ${dial('brk ' + mood, `<div class="time num" data-cd="${t}" data-dur="${dur}" data-h="1">${fmtH(dur - el, over)}</div>`, [{ t, dur }])}
        <h2>${over ? 'Süre doldu' : 'İyi molalar'}</h2>
        <div class="sub">${over ? 'Döndüğünüzde aşağıdaki butona basın.' : `${esc(T.ad)} · ${T.dk} dakika`}</div>
      </div>
      ${acts(`<button class="btn" data-a="back" ${dis}>Döndüm</button>`)}`;
  }
  else if (i.idx < 0){
    const other = w && w.k !== tab;
    key = 'idle' + other;
    const wait = i.list.length ? eta(tab, i.list.length) : (i.free ? 0 : eta(tab, 0));
    html = `<div class="hero">
        ${dial('', SVG(ICON[tab], 'ic float') + `<div class="cap">${i.free ? `${i.free} BOŞ YER` : 'DOLU'}</div>`, slots(tab))}
        <h2>${esc(T.ad)}</h2>
        <div class="sub">${other
          ? `Şu an <b>${esc(TURLER[w.k].ad.toLocaleLowerCase('tr'))}</b> ${w.yer === 'a' ? 'molasındasınız' : 'sırasındasınız'}.`
          : !i.list.length && i.free ? 'Sıra boş, hemen çıkabilirsiniz.' : `Sırada <b>${i.list.length}</b> kişi var.`}</div>
        ${!other && wait ? `<div class="sub2">Tahmini bekleme ~${wait} dk</div>` : ''}
      </div>
      ${acts(other
        ? `<button class="btn ghost" data-tab="${w.k}">${esc(TURLER[w.k].kisa)} ekranına git</button>`
        : `<button class="btn" data-a="join" ${dis}>Sıraya gir</button>`)}`;
  }
  else if (i.myTurn){
    const nx = i.list[i.idx + 1];
    mood = 'turn'; key = 'turn';
    html = `<div class="hero">
        ${dial('turn', SVG(ICON.check, 'ic'), [{ f: 1 }])}
        <h2>Sıra sizde</h2>
        <div class="sub">${nx ? `Hazır değilseniz atlayın, <b>${esc(nx.n)}</b> ile yer değiştirirsiniz.` : `${esc(T.ad)} için çıkabilirsiniz.`}</div>
      </div>
      ${acts(nx ? `<div class="row2"><button class="btn ghost" data-a="skip" ${dis}>Atla</button><button class="btn ok" data-a="go" ${dis}>Molaya çık</button></div>`
                : `<button class="btn ok" data-a="go" ${dis}>Molaya çık</button>`,
             link('leave', 'Sıradan çık'))}`;
  }
  else {
    const nx = i.list[i.idx + 1];
    const names = Object.values(state[tab].a).map(a => esc(a.n.split(' ')[0]));
    const ahead = i.list.slice(0, i.idx);
    const shown = ahead.slice(0, 5);
    key = 'q' + i.idx;
    html = `<div class="hero">
        ${dial('', `<div class="bigN num" id="bigN">${i.idx + 1}</div><div class="cap">SIRANIZ</div>`, slots(tab))}
        <h2>${i.idx === 0 ? 'Sıradaki sizsiniz' : 'Sıradasınız'}</h2>
        <div class="sub">${i.idx === 0
          ? `<b>${names.join(', ')}</b> dönünce sıra sizde.`
          : `Önünüzde <b>${i.idx}</b> kişi var.`}</div>
        ${ahead.length ? `<div class="faces">${shown.map((x,j) => `<span class="av" style="animation-delay:${.15 + j*.06}s" title="${esc(x.n)}">${ini(x.n)}</span>`).join('')}${ahead.length > 5 ? `<span class="av">+${ahead.length - 5}</span>` : ''}<span class="av me" style="animation-delay:${.15 + shown.length*.06}s, ${1 + shown.length*.06}s">${ini(me.name)}</span></div>` : ''}
        <div class="sub2">Tahmini bekleme ~${eta(tab, i.idx)} dk</div>
      </div>
      ${i.idx === 0 && nx
        ? acts(`<button class="btn ghost" data-a="skip" ${dis}>Atla</button>`, link('leave', 'Sıradan çık'))
        : acts(`<button class="btn ghost" data-a="leave" ${dis}>Sıradan çık</button>`)}`;
  }

  document.body.className = 'm-' + tab + (mood ? ' ' + mood : '');
  const prevIdx = lastIdx[tab]; lastIdx[tab] = i.idx;
  key = tab + key;
  if (html !== lastHtml){ $('#card').innerHTML = html; lastHtml = html; }   // aynıysa dokunma: animasyonlar tekrar oynamasın
  if (key !== lastKey){ $('#card').classList.remove('enter'); void $('#card').offsetWidth; $('#card').classList.add('enter'); lastKey = key; }
  else $('#card').classList.remove('enter');
  const bn = $('#bigN');
  if (bn && prevIdx > i.idx && prevIdx >= 0){
    bn.classList.add('roll');
    bn.closest('.dial').insertAdjacentHTML('beforeend', `<span class="upfx">+${prevIdx - i.idx}</span>`);
  }

  $('#listBtn').className = 'link' + (listOpen ? ' open' : '');
  const cnt = i.list.length + i.active;
  $('#listBtn').innerHTML = (listOpen ? 'Listeyi gizle' : cnt ? `Sırayı gör · ${cnt} kişi` : 'Sırayı gör') + SVG(ICON.down);
  $('#list').classList.toggle('hidden', !listOpen);

  const dur = T.dk * 60000;
  const act = Object.entries(state[tab].a).map(([id,a]) => ({id, ...a})).sort((x,y) => x.t - y.t);
  const tag = id => id === me.id ? '<span class="tag">Siz</span>' : '';
  $('#list').innerHTML =
    `<div class="grp"><span>Molada</span><span>${act.length}/${T.ayniAnda}</span></div>` +
    (act.length ? act.map(a => {
      const el = now() - a.t;
      return `<div class="li ${a.id === me.id ? 'me':''}">
        <span class="av">${ini(a.n)}</span>
        <span class="nm">${esc(a.n)}${tag(a.id)}</span>
        <span class="tm ${el > dur ? 'red':''}" data-cd="${a.t}" data-dur="${dur}">${el > dur ? '+' : ''}${fmt(dur - el)}</span>
        ${el > dur * ZORLA_KAT && a.id !== me.id ? `<button class="x" data-a="kick" data-id="${esc(a.id)}">Bitir</button>` : ''}
      </div>`; }).join('') : `<div class="empty">Kimse yok</div>`) +
    `<div class="grp"><span>Sırada</span><span>${i.list.length}</span></div>` +
    (i.list.length ? i.list.map((x,k) => `
      <div class="li ${x.id === me.id ? 'me':''}"><span class="n">${k+1}</span><span class="av">${ini(x.n)}</span><span class="nm">${esc(x.n)}${tag(x.id)}</span></div>`).join('')
      : `<div class="empty">Kimse yok</div>`) +
    `<button class="link adm-link" data-a="admin">Yönetici</button>`;
  renderAdmin();
}

/* ---------- yönetici ekranı ---------- */
// şifrenin kendisi değil özeti saklanır; şifre değişirse eski kilit açıklığı geçersiz olur
const hsh = str => { let h = 5381; for (const ch of str) h = (h * 33 ^ ch.codePointAt(0)) >>> 0; return h.toString(36); };
const admOk = () => store.get('mola_admin') === hsh(YONETICI_SIFRE);
let admHtml = '';

function renderAdmin(){
  if ($('#admin').classList.contains('hidden')) return;
  $('#admLockBtn').classList.toggle('off', !admOk());
  let h;
  if (!admOk()){
    h = `<div class="pin">
        <div class="lock">${SVG('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>')}</div>
        <h2>Yönetici girişi</h2>
        <div class="sub">Devam etmek için şifreyi girin.</div>
        <div class="field" style="width:100%"><input id="admPin" type="password" autocomplete="off" placeholder="Şifre" enterkeyhint="go"></div>
        <button class="btn" data-a="admPinGo" style="--c:#fb923c;--c2:#f97316">Aç</button>
      </div>`;
    if (admHtml.startsWith('<div class="pin">')) return;   // yazılan şifre silinmesin
    $('#admBody').innerHTML = admHtml = h;
    setTimeout(() => { const p = $('#admPin'); if (p) p.focus(); }, 50);
    return;
  }
  if (!ready){ $('#admBody').innerHTML = admHtml = '<div class="anote">Yükleniyor…</div>'; return; }

  h = KEYS.map(k => {
    const c = cfg(k), dur = c.dk * 60000;
    const act = Object.entries(state[k].a).map(([id,a]) => ({id, ...a})).sort((x,y) => x.t - y.t);
    const q = sorted(state[k].q);
    return `<div class="acard a-${k}">
      <div class="ah">${SVG(ICON[k])}<b>${esc(c.ad)}</b><small>${act.length}/${c.ayniAnda} molada · ${q.length} sırada</small></div>
      <div class="setrow"><span>Aynı anda</span>
        <div class="step"><button data-a="cfg" data-k="${k}" data-f="ayniAnda" data-d="-1" ${c.ayniAnda <= 1 ? 'disabled' : ''}>−</button><b>${c.ayniAnda} kişi</b><button data-a="cfg" data-k="${k}" data-f="ayniAnda" data-d="1" ${c.ayniAnda >= 20 ? 'disabled' : ''}>+</button></div></div>
      <div class="setrow"><span>Süre</span>
        <div class="step"><button data-a="cfg" data-k="${k}" data-f="dk" data-d="-5" ${c.dk <= 5 ? 'disabled' : ''}>−</button><b>${c.dk} dk</b><button data-a="cfg" data-k="${k}" data-f="dk" data-d="5" ${c.dk >= 120 ? 'disabled' : ''}>+</button></div></div>
      <div class="grp"><span>Molada</span><span>${act.length}</span></div>
      ${act.length ? act.map(a => { const el = now() - a.t; return `<div class="li">
          <span class="av">${ini(a.n)}</span><span class="nm">${esc(a.n)}</span>
          <span class="tm ${el > dur ? 'red' : ''}" data-cd="${a.t}" data-dur="${dur}">${el > dur ? '+' : ''}${fmt(dur - el)}</span>
          <button class="mini red" data-a="aKick" data-k="${k}" data-id="${esc(a.id)}" data-confirm="1">Bitir</button>
        </div>`; }).join('') : '<div class="empty">Kimse yok</div>'}
      <div class="grp"><span>Sırada</span><span>${q.length}</span></div>
      ${q.length ? q.map((x, j) => `<div class="li">
          <span class="n">${j + 1}</span><span class="av">${ini(x.n)}</span><span class="nm">${esc(x.n)}</span>
          <span class="acts2">${j ? `<button class="mini" data-a="aUp" data-k="${k}" data-id="${esc(x.id)}" aria-label="Öne al">↑</button>` : ''}<button class="mini red" data-a="aRemove" data-k="${k}" data-id="${esc(x.id)}" data-confirm="1">Çıkar</button></span>
        </div>`).join('') : '<div class="empty">Kimse yok</div>'}
    </div>`;
  }).join('') + `
    <button class="btn danger" data-a="reset" data-confirm="1">Tüm sırayı sıfırla</button>
    <div class="anote">Ayarlar herkese anında uygulanır.</div>`;
  if (h !== admHtml){ $('#admBody').innerHTML = admHtml = h; }
}

/* her saniye: sadece sayaç, halka ve çentikler güncellenir */
setInterval(() => {
  if (!me) return;
  let rerender = false;
  document.querySelectorAll('[data-cd]').forEach(el => {
    const e = now() - +el.dataset.cd, dur = +el.dataset.dur, over = e > dur;
    const txt = el.dataset.h ? fmtH(dur - e, over) : (over ? '+' : '') + fmt(dur - e);
    if (el.dataset.h) el.innerHTML = txt; else el.textContent = txt;
    el.classList.toggle('red', over);
    const d = el.closest('.dial');
    if (over && d && !d.classList.contains('over')) rerender = true;
  });
  document.querySelectorAll('[data-ring]').forEach(c => {
    const raw = (now() - +c.dataset.ring) / +c.dataset.dur, f = Math.min(1, raw);
    c.setAttribute('stroke-dasharray', `${(+c.dataset.len * f).toFixed(1)} ${CIRC.toFixed(1)}`);
    c.classList.toggle('zero', f < .003);
    c.classList.toggle('ov', raw > 1);
  });
  document.querySelectorAll('.ticks').forEach(g => {
    const r = g.closest('svg').querySelector('[data-ring]'); if (!r) return;
    const f = Math.min(1, (now() - +r.dataset.ring) / +r.dataset.dur);
    g.querySelectorAll('line').forEach((l, k) => l.classList.toggle('on', k / TICKS < f));
  });
  const lim = cfg(tab).dk * 60000 * ZORLA_KAT;
  if (Object.values(state[tab].a).some(a => { const d = now() - a.t - lim; return d > 0 && d < 1100; })) rerender = true;
  if (rerender) render();
}, 1000);

/* ---------- olaylar ---------- */
document.addEventListener('click', e => {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(_){} }
  const t = e.target.closest('[data-tab]');
  if (t){
    if (t.dataset.tab !== tab){
      tab = t.dataset.tab; store.set('mola_tab', tab); render();
      const ic = document.querySelector(`.tab[data-tab="${tab}"] svg`);
      if (ic){ ic.classList.remove('pop'); void ic.offsetWidth; ic.classList.add('pop'); }
      if (navigator.vibrate) navigator.vibrate(8);
    }
    return;
  }
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === 'list'){ listOpen = !listOpen; render(); if (listOpen){ const l = $('#list'); l.classList.remove('fresh'); void l.offsetWidth; l.classList.add('fresh'); stagger(l); } return; }
  if (a === 'rename'){ $('#nameIn').value = me.name; show('login'); $('#nameIn').focus(); return; }
  if (a === 'kick') b.dataset.confirm = 1;
  // onay isteyen butonlar: ilk dokunuşta "Emin misiniz?", ikincide işlem
  if (b.dataset.confirm && !b.dataset.sure){
    const old = b.textContent;
    b.dataset.sure = 1; b.textContent = 'Emin misiniz?';
    setTimeout(() => { if (b.isConnected){ delete b.dataset.sure; b.textContent = old; } }, 3000);
    return;
  }
  // yönetici
  if (a === 'admin'){ admHtml = ''; show('admin'); window.scrollTo(0, 0); render(); return; }
  if (a === 'admBack'){ show('main'); render(); return; }
  if (a === 'admLock'){ store.set('mola_admin', ''); admHtml = ''; render(); return; }
  if (a === 'admPinGo'){ admPinGo(); return; }
  if (a === 'cfg'){ run('cfg', { k: b.dataset.k, f: b.dataset.f, d: +b.dataset.d }); return; }
  if (a === 'aKick' || a === 'aRemove' || a === 'aUp'){ run(a, { k: b.dataset.k, id: b.dataset.id }); return; }
  if (a === 'kick'){ run('kick', b.dataset.id); return; }
  run(a);
});

$('#loginBtn').addEventListener('click', login);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'admPin'){ e.preventDefault(); admPinGo(); } });
function admPinGo(){
  const p = $('#admPin'); if (!p) return;
  if (p.value === YONETICI_SIFRE){ store.set('mola_admin', hsh(YONETICI_SIFRE)); admHtml = ''; render(); }
  else { p.value = ''; p.classList.remove('err'); void p.offsetWidth; p.classList.add('err'); p.focus(); }
}
$('#nameIn').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); login(); } });

function login(){
  const inp = $('#nameIn');
  const name = inp.value.trim().replace(/\s+/g, ' ');
  if (!name){ inp.classList.remove('err'); void inp.offsetWidth; inp.classList.add('err'); inp.focus(); return; }
  inp.classList.remove('err');
  me = { id: (me && me.id) || (Date.now().toString(36) + Math.random().toString(36).slice(2,8)), name };
  store.set('mola_me', JSON.stringify(me));
  if (tx) tx(s => {   // sıradaysa / moladaysa ismi de güncelle
    let ch = false;
    KEYS.forEach(k => {
      if (s[k].q[me.id]){ s[k].q[me.id].n = name; ch = true; }
      if (s[k].a[me.id]){ s[k].a[me.id].n = name; ch = true; }
    });
    return ch ? s : undefined;
  });
  start();
}

function show(id){ ['login','main','admin'].forEach(x => $('#'+x).classList.toggle('hidden', x !== id)); }
function start(){
  if (!tx){ initStore(); buildTabs(); }
  const w = where(); if (w) tab = w.k;   // açılışta bulunduğunuz sekmeye git
  $('#myAv').innerHTML = ini(me.name);
  $('#myName').textContent = me.name.split(' ')[0];
  show('main'); render();
}

if (me && me.id && me.name) start();
else show('login');
</script>
</body>
